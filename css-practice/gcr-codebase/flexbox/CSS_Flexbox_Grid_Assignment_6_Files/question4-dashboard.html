<!DOCTYPE html>

  <link rel="stylesheet" href="question4-dashboard.css">
</head>
<body>

  <aside class="sidebar"><h2>Navigation</h2><a href="#overview">Overview</a><a href="#reports">Reports</a><a href="#analytics">Analytics</a><a href="#settings">Settings</a></aside>
  <main class="dashboard-main" id="overview">
    <article class="dash-card wide"><h2>Overview</h2><p>Your key activity and performance summary.</p></article>
    <article class="dash-card" id="reports"><h2>Reports</h2><p>12 reports available</p></article>
    <article class="dash-card" id="analytics"><h2>Analytics</h2><p>Visitors are trending upward.</p></article>
    <article class="dash-card" id="settings"><h2>Settings</h2><p>Manage account preferences.</p></article>
  </main>
