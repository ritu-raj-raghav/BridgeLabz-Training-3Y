<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="question8-photo-gallery.css">
</head>
<body>
  <main class="gallery-page">
    <h1>Photo Gallery</h1>
    <section class="photo-grid">
      <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape"><figcaption>Mountain Escape</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake surrounded by mountains"><figcaption>Quiet Lake</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain lake at sunset"><figcaption>Golden Hour</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight in a green forest"><figcaption>Forest Trail</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="High mountain peaks"><figcaption>High Peaks</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Sunrise over a field"><figcaption>Morning Light</figcaption></figure>
    </section>
  </main>
</body>
</html>
