<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip</title>
  <link rel="stylesheet" href="question9-card-flip.css">
</head>
<body>
  <main class="flip-page">
    <h1>Hover to Flip the Card</h1>
    <div class="flip-card" tabindex="0" aria-label="Flip card about web development">
      <div class="flip-inner">
        <section class="card-face card-front">
          <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=700&q=80" alt="Laptop displaying code">
          <h2>Web Development</h2>
          <p>Hover or focus to learn more</p>
        </section>
        <section class="card-face card-back">
          <h2>Build for the Web</h2>
          <p>Web development combines structure, style and thoughtful design to create useful experiences across devices.</p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
