<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 8 - Q10: Mini User Interface Layout</title>
    <link rel="stylesheet" href="question10-mini-ui-layout.css" />
  </head>
  <body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-inner">
        <div class="logo">DevPortal<span>MiniUI</span></div>
        <span class="user-pill">Assignment 8 &mdash; Q10</span>
      </div>
    </header>

    <!-- ===== MAIN CONTENT CARD (COMPACT USER INTERFACE) ===== -->
    <main class="main-wrapper">

      <section class="compact-card">

        <!-- Card Top Bar with Small Profile Image / Badge -->
        <div class="card-hero">
          <div class="image-wrapper">
            <!-- Small Image Profile Avatar -->
            <svg class="profile-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#4f46e5" />
                  <stop offset="100%" stop-color="#7c3aed" />
                </linearGradient>
              </defs>
              <rect width="100%" height="100%" rx="50%" fill="url(#avatarGrad)" />
              <circle cx="50" cy="40" r="18" fill="#ffffff" />
              <path d="M22 84 C 24 64, 76 64, 78 84 Z" fill="#ffffff" />
            </svg>
          </div>
          <div class="hero-info">
            <h2>Developer Enrollment Card</h2>
            <p>Complete your profile registration for BridgeLabz CSS Masterclass.</p>
          </div>
        </div>

        <!-- Enrollment Form -->
        <form class="enrollment-form" action="#" method="post" onsubmit="return false;">

          <div class="form-grid">
            <!-- Full Name -->
            <div class="form-group">
              <label for="devName">Full Name</label>
              <input type="text" id="devName" placeholder="e.g. Ritu Raj Raghav" required />
            </div>

            <!-- Email Address -->
            <div class="form-group">
              <label for="devEmail">Email Address</label>
              <input type="email" id="devEmail" placeholder="e.g. ritu@bridgelabz.com" required />
            </div>

            <!-- Track Selection -->
            <div class="form-group">
              <label for="devTrack">Engineering Track</label>
              <select id="devTrack" required>
                <option value="" disabled selected>Select Track</option>
                <option value="frontend">Frontend &amp; Modern CSS</option>
                <option value="backend">Backend Microservices</option>
                <option value="fullstack">Full Stack Engineering</option>
              </select>
            </div>

            <!-- Bio / Comments -->
            <div class="form-group full-width">
              <label for="devNotes">Short Bio / Motivation</label>
              <textarea id="devNotes" rows="3" placeholder="Tell us about your learning goals..."></textarea>
            </div>
          </div>

          <!-- Buttons Group -->
          <div class="buttons-bar">
            <button type="submit" class="btn btn-submit">Submit Registration</button>
            <button type="reset" class="btn btn-secondary">Clear Form</button>
          </div>

        </form>

      </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
      <p>BridgeLabz Training &mdash; CSS Assignment 8 &mdash; Q10: Complete Mini UI Layout</p>
    </footer>

  </body>
</html>
