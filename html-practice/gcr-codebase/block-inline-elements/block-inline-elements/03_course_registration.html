<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Course Registration</title>
</head>
<body>
    <!-- Assignment 3: Course Registration. HTML only; no CSS or JavaScript. -->
    <h1>Course Registration Form</h1><form action="#" method="get"><fieldset><legend>Student Details</legend>
<p><label for="name">Full Name:</label> <input id="name" name="name" type="text" required></p>
<p><label for="email">Email:</label> <input id="email" name="email" type="email" required></p>
<p><label for="course">Course:</label> <select id="course" name="course" required><option value="">-- Choose a course --</option><option>HTML Fundamentals</option><option>Java Programming</option><option>Database Basics</option></select></p>
<button type="submit">Submit Registration</button></fieldset></form>
<h2>Available Course Schedules</h2><table border="1"><thead><tr><th>Day</th><th>Time</th><th>Instructor</th></tr></thead><tbody><tr><td>Monday</td><td>10:00–11:00 AM</td><td>Instructor A</td></tr><tr><td>Wednesday</td><td>2:00–3:00 PM</td><td>Instructor B</td></tr><tr><td>Friday</td><td>11:00 AM–12:00 PM</td><td>Instructor C</td></tr></tbody></table>
</body>
</html>
