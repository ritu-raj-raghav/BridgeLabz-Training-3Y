<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Preference Selection</title>
</head>
<body>
    <!-- Assignment 3: Travel Preference Selection. HTML only; no CSS or JavaScript. -->
    <h1>Select Your Travel Preferences</h1><form action="#" method="get">
<p><label for="country">Country:</label> <select id="country" name="country"><option selected>India</option><option>Japan</option><option>Italy</option></select></p>
<p><label for="state">State:</label> <select id="state" name="state"><option selected>Uttar Pradesh</option><option>Rajasthan</option><option>Himachal Pradesh</option></select></p>
<p><label for="city">City:</label> <select id="city" name="city"><option selected>Mathura</option><option>Jaipur</option><option>Manali</option></select></p>
<p><label for="place">Favorite Tourist Place:</label> <select id="place" name="place"><option selected>Taj Mahal</option><option>Hawa Mahal</option><option>Hadimba Temple</option></select></p><button type="submit">Submit Choices</button></form>
<p>My selected preferences are India, Uttar Pradesh, Mathura, and the Taj Mahal as my favorite tourist place.</p>
</body>
</html>
