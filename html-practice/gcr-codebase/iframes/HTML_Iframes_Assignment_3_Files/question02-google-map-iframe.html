<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2 - Google Map</title>
</head>
<body>
  <h1>Map of Mathura</h1>
  <!-- loading="lazy" delays loading the map until it is near the visible area. -->
  <iframe
    title="Google Map showing Mathura"
    width="600"
    height="450"
    src="https://maps.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&t=&z=13&ie=UTF8&iwloc=&output=embed"
    loading="lazy">
  </iframe>
</body>
</html>
