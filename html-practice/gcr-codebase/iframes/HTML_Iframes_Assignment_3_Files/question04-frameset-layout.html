<!DOCTYPE html>
<!-- The frameset element is obsolete in HTML5, but is included because this assignment specifically requests it. -->
<html>
<head>
  <title>Question 4 - Frameset Layout</title>
</head>
<frameset rows="25%,75%">
  <frame src="navigation.html" title="Navigation links">
  <frame src="welcome.html" name="welcome-frame" title="Welcome message">
  <noframes>
    <body>Your browser does not support frames.</body>
  </noframes>
</frameset>
</html>
