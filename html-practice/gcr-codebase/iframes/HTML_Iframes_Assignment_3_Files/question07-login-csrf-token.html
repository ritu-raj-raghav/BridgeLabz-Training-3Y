<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 7 - Login Form</title>
</head>
<body>
  <h1>Login</h1>
  <form action="#" method="post">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <input type="hidden" name="csrf_token" value="dummy-csrf-token-123">
    <!-- A CSRF token helps a server check that a submitted request came from an expected form. A real token must be securely generated and validated by the server. -->
    <br><br>
    <button type="submit">Log In</button>
  </form>
</body>
</html>
