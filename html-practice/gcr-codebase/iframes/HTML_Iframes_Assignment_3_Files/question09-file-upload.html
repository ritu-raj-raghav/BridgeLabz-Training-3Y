<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 9 - File Upload</title>
</head>
<body>
  <h1>Upload an Image</h1>
  <p>Only PNG (.png) or JPG (.jpg) image files are allowed by this file picker.</p>
  <form action="#" method="post" enctype="multipart/form-data">
    <label for="image-file">Choose an image:</label>
    <input type="file" id="image-file" name="image-file" accept=".png,.jpg">
    <br><br>
    <button type="submit">Upload File</button>
  </form>
</body>
</html>
