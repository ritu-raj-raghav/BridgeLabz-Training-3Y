<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 15 - Payment Form</title>
</head>
<body>
  <h1>Payment Form (Demo)</h1>
  <form action="#" method="post">
    <label for="cardholder">Cardholder Name:</label>
    <input type="text" id="cardholder" name="cardholder" required>
    <br><br>
    <label for="card-number">Card Number:</label>
    <input type="text" id="card-number" name="card-number" inputmode="numeric" required>
    <br><br>
    <label for="expiry-date">Expiry Date:</label>
    <input type="month" id="expiry-date" name="expiry-date" required>
    <br><br>
    <label for="cvv">CVV:</label>
    <input type="password" id="cvv" name="cvv" inputmode="numeric" required>
    <br><br>
    <button type="submit">Pay Now</button>
  </form>
  <p>This is a demonstration form only. Do not enter real payment details.</p>
</body>
</html>
