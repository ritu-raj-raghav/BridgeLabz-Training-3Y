<body>
  <h1>URI Encoding</h1>
  <p>The space is encoded as %20, and the ampersand in the search value is encoded as %26.</p>
  <p>Correct encoded URL:</p>
  <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a>
