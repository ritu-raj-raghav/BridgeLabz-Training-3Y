<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding used by this document. -->
  <meta charset="UTF-8">
  <!-- Describes the page for search engines and previews. -->
  <meta name="description" content="A demonstration of important HTML head elements.">
  <!-- Identifies the author of the page. -->
  <meta name="author" content="Ritu Raj Raghav">
  <!-- Sets a base URL for relative URLs in the document. -->
  <base href="https://example.com/">
  <!-- Sets the page title shown in the browser tab. -->
  <title>Question 20 - Head Elements</title>
  <!-- Links to a favicon resource. -->
  <link rel="icon" href="favicon.ico">
  <!-- The style element can contain CSS; left empty for this HTML-only assignment. -->
  <style></style>
  <!-- The script element can contain JavaScript; left empty for this HTML-only assignment. -->
  <script></script>
</head>
<body>
  <h1>Important HTML Head Elements</h1>
  <p>View the comments in the head section to learn the purpose of each element.</p>
  <a href="about.html">Example relative link using the base URL</a>
</body>
</html>
